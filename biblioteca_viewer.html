<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Discografica</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0d09;color:#f0ead6;font-family:'Palatino Linotype',Georgia,serif;padding:16px;max-width:880px;margin:0 auto}
h1{color:#c9a84c;font-weight:400;font-size:19px;margin-bottom:2px}
.sub{color:#6a5f4a;font-size:11px;margin-bottom:14px}
#search{width:100%;background:#17140f;border:1px solid #2e2820;color:#f0ead6;padding:10px 14px;border-radius:6px;font-size:13px;outline:none;margin-bottom:16px;font-family:inherit}
.composer{margin-bottom:20px}
.comp-name{color:#c9a84c;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:6px 0;border-bottom:1px solid #2e2820;margin-bottom:8px}
.work-row{background:#17140f;border:1px solid #2e2820;border-radius:6px;padding:12px 14px;margin-bottom:7px;cursor:pointer;user-select:none}
.work-row:hover{border-color:#3a3020}
.work-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.work-title{color:#f0ead6;font-size:14px;font-style:italic;flex:1}
.work-arrow{color:#c9a84c;font-size:13px;flex-shrink:0;margin-top:1px}
.work-meta{color:#6a5f4a;font-size:10px;margin-top:3px}
.work-summary{color:#9a8e7a;font-size:11px;line-height:1.65;margin-top:7px}
.recordings{display:none;margin-top:12px;border-top:1px solid #2e2820;padding-top:10px}
.rec{background:#0f0d09;border:1px solid #2e2820;border-radius:5px;padding:10px 13px;margin-bottom:7px}
.rec-header{display:flex;align-items:flex-start;gap:10px}
.rec-rank{color:#c9a84c;font-size:18px;font-weight:700;min-width:22px;font-family:Georgia;flex-shrink:0}
.rec-name{color:#f0ead6;font-size:13px;font-weight:600}
.rec-lvl{background:#3a3020;color:#c9a84c;font-size:9px;padding:1px 5px;border-radius:3px;font-family:monospace;margin-left:5px}
.rec-cons{font-size:11px;margin-left:4px}
.rec-lbl{color:#6a5f4a;font-size:11px;margin-top:2px}
.stars-row{display:flex;gap:14px;margin-top:6px}
.star-b{display:flex;align-items:center;gap:5px}
.star-l{color:#6a5f4a;font-size:9px;letter-spacing:1px}
.stars{color:#c9a84c;font-size:11px}
.stars-dim{color:#3a3020;font-size:11px}
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.nbox{background:#0a0806;border-radius:4px;padding:7px 10px}
.ntit{color:#c9a84c;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
.ntxt{color:#9a8e7a;font-size:11px;line-height:1.6}
.crit{background:#0a0806;border-radius:4px;padding:7px 10px;margin-top:6px}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.btns2{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
a.bq{background:#0e2a1a;border:1px solid #3a8a50;color:#4acf7a;padding:4px 9px;border-radius:4px;font-size:10px;text-decoration:none;display:inline-block}
a.br{background:#1a1f3a;border:1px solid #4a5a9a;color:#7a9acf;padding:4px 9px;border-radius:4px;font-size:10px;text-decoration:none;display:inline-block}
a.ba{background:#1a3a2a;border:1px solid #4a9a6a;color:#7acf9a;padding:4px 9px;border-radius:4px;font-size:10px;text-decoration:none;display:inline-block}
.ui{background:#0a0806;border:1px solid #4a8a4a;color:#f0ead6;padding:4px 7px;border-radius:4px;font-size:10px;outline:none;width:150px;font-family:inherit}
.bs{background:#1a3a1a;border:1px solid #4a8a4a;color:#7acf9a;padding:4px 7px;border-radius:4px;font-size:10px;cursor:pointer}
.reco{background:#17140f;border:1px solid #c9a84c44;border-radius:5px;padding:10px 13px;margin-top:8px;color:#9a8e7a;font-size:11px;line-height:1.7}
.rl{color:#c9a84c;font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
#msg{position:fixed;bottom:16px;right:16px;background:#1a3a1a;border:1px solid #4a9a6a;color:#7acf9a;padding:8px 14px;border-radius:6px;font-size:12px;display:none}
</style>
</head>
<body>
<h1>📚 Biblioteca Discografica</h1>
<p class="sub" id="sub">Caricamento...</p>
<input id="search" placeholder="Cerca compositore o opera..." oninput="doFilter()">
<div id="content"></div>
<div id="msg">✓ Salvato</div>
<script>
var ALL=[];
function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var REPO="giovanniguazzarotti-spec/discografia",GH="biblioteca.json";
function tok(){try{return localStorage.getItem("cdc_gh_tok_v1")||"";}catch{return "";}}
function hdr(){return{"Authorization":"token "+tok(),"Content-Type":"application/json","User-Agent":"DA"};}
function st(n){return"★".repeat(n||0)+'<span class="stars-dim">'+"★".repeat(5-(n||0))+"</span>";}
function oq(url){if(!url)return null;try{var u=new URL(url);var p=u.pathname.split("/").filter(Boolean);var id=p[p.length-1];return id?"https://open.qobuz.com/album/"+id:url;}catch{return url;}}

async function push(lib){
  var t=tok();if(!t)return;
  try{
    var sha="";
    var r=await fetch("https://api.github.com/repos/"+REPO+"/contents/"+GH,{headers:hdr()});
    if(r.ok){var d=await r.json();sha=d.sha||"";}
    var b={message:"Aggiorna biblioteca",content:btoa(unescape(encodeURIComponent(JSON.stringify(lib)))),branch:"main"};
    if(sha)b.sha=sha;
    await fetch("https://api.github.com/repos/"+REPO+"/contents/"+GH,{method:"PUT",headers:hdr(),body:JSON.stringify(b)});
    var m=document.getElementById("msg");m.style.display="block";setTimeout(function(){m.style.display="none";},2000);
  }catch(e){}
}

function saveUrl(eid,rank,fid){
  var inp=document.getElementById(fid);if(!inp)return;
  var raw=inp.value.trim();
  var m=raw.match(/https:\/\/open\.qobuz\.com\/album\/\w+/);
  var url=m?m[0]:(raw.startsWith("http")?raw:"");
  if(!url)return;
  ALL=ALL.map(function(e){
    if(e.id!==eid)return e;
    return Object.assign({},e,{recordings:(e.recordings||[]).map(function(r){
      if(r.rank!==rank)return r;
      if((r.qobuz||[]).some(function(q){return q.url===url;}))return r;
      return Object.assign({},r,{qobuz:[].concat(r.qobuz||[],[{label:"Ascolta",url:url}])});
    })});
  });
  inp.value="";
  push(ALL);
  doFilter();
}

function getComp(e){
  if(e.composer)return e.composer;
  var w=e.work||"";
  var m=w.match(/^([^–—]+)[–—]/);
  return m?m[1].trim():"—";
}

function getWork(e){
  var w=e.work||"";
  var m=w.match(/^[^–—]+[–—]\s*(.+)/);
  return m?m[1]:w;
}

function toggle(id){
  var el=document.getElementById("r-"+id);
  var ar=document.getElementById("a-"+id);
  if(!el)return;
  var open=el.style.display==="block";
  el.style.display=open?"none":"block";
  if(ar)ar.textContent=open?"▼":"▲";
}

function renderLib(lib){
  var groups={};
  lib.forEach(function(e){
    var c=getComp(e);
    if(!groups[c])groups[c]=[];
    groups[c].push(e);
  });
  var html="";
  Object.keys(groups).sort().forEach(function(comp){
    html+='<div class="composer"><div class="comp-name">'+comp+'</div>';
    groups[comp].forEach(function(e){
      var rid="rc-"+e.id;
      var wt=getWork(e);
      var recsHtml=buildRecs(e);
      html+='<div class="work-row" onclick="toggle(\''+e.id+'\')">'
        +'<div class="work-top"><span class="work-title">'+esc(wt)+'</span><span class="work-arrow" id="a-'+e.id+'">▼</span></div>'
        +'<div class="work-meta">'+(e.instrument&&e.instrument!=="n/d"&&e.instrument!=="—"?e.instrument+" · ":"")+( e.compositionYear?e.compositionYear+" · ":"")+( e.recordings||[]).length+" registrazioni</div>"
        +(e.summary?'<div class="work-summary">'+esc(e.summary)+"</div>":"")
        +'<div class="recordings" id="r-'+e.id+'" onclick="event.stopPropagation()">'+recsHtml
        +(e.recommendation?'<div class="reco"><div class="rl">💡 Consiglio finale</div>'+esc(e.recommendation)+"</div>":"")
        +"</div></div>";
    });
    html+="</div>";
  });
  document.getElementById("content").innerHTML=html||'<p style="color:#6a5f4a;padding:20px;text-align:center">Nessuna guida trovata.</p>';
}

function buildRecs(e){
  return(e.recordings||[]).map(function(rec){
    var cc=rec.consensusIcon==="🟢"?"#5a9e70":rec.consensusIcon==="🔴"?"#c96060":"#c9a84c";
    var uid=e.id.slice(-5)+rec.rank;
    var fq=(rec.qobuz||[]).find(function(q){return q.url&&oq(q.url);});
    var rls=(rec.reviews||[]).filter(function(r){return r.url;}).map(function(r){return'<a class="br" href="'+r.url+'" target="_blank" rel="noopener">📰 '+r.label+"</a>";}).join("");
    return'<div class="rec">'
      +'<div class="rec-header"><div class="rec-rank">'+rec.rank+'</div>'
      +'<div style="flex:1"><div><span class="rec-name">'+esc(rec.interpreter)+'</span><span class="rec-lvl">LIV.'+esc(rec.level)+'</span><span class="rec-cons" style="color:'+cc+'">'+rec.consensusIcon+" "+esc(rec.consensus)+"</span></div>"
      +'<div class="rec-lbl">'+(e.composer&&e.composer!=="—"?e.composer+" · ":"")+(e.compositionYear&&e.compositionYear!=="—"?e.compositionYear+" · ":"")+esc(rec.label)+" · "+esc(rec.year)+(rec.books?" · "+rec.books:"")+"</div></div></div>"
      +'<div class="stars-row"><div class="star-b"><span class="star-l">ESEC.</span><span class="stars">'+st(rec.execStars)+"</span></div>"
      +'<div class="star-b"><span class="star-l">REG.</span><span class="stars">'+st(rec.recStars)+"</span></div></div>"
      +(rec.execNote||rec.recNote?'<div class="ngrid">'
        +(rec.execNote?'<div class="nbox"><div class="ntit">⭐ Esecuzione</div><div class="ntxt">'+esc(rec.execNote)+"</div></div>":"")
        +(rec.recNote?'<div class="nbox"><div class="ntit">🎙️ Registrazione</div><div class="ntxt">'+esc(rec.recNote)+"</div></div>":"")
        +"</div>":"")
      +(rec.criticalNote?'<div class="crit"><div class="ntit">📰 Critica</div><div class="ntxt">'+esc(rec.criticalNote)+"</div></div>":"")
      +(rls?'<div class="btns2">'+rls+"</div>":"")
      +'<div class="btns"><a class="ba" href="https://open.qobuz.com/album/0060253780968" target="_blank" rel="noopener">📱 Qobuz</a>'
      +(fq?'<a class="bq" href="'+oq(fq.url)+'" target="_blank" rel="noopener,noreferrer">🎵 Ascolta</a>':"")
      +'<span style="display:inline-flex;gap:4px;align-items:center"><input class="ui" id="u'+uid+'" placeholder="URL Qobuz...">'
      +'<button class="bs" onclick="saveUrl(\''+e.id+'\','+rec.rank+',\'u'+uid+'\')">💾</button></span></div>'
    +"</div>";
  }).join("");
}

function doFilter(){
  var q=document.getElementById("search").value.toLowerCase().trim();
  var filtered=q?ALL.filter(function(e){
    return(e.composer||"").toLowerCase().includes(q)
      ||(e.work||"").toLowerCase().includes(q)
      ||(e.instrument||"").toLowerCase().includes(q)
      ||(e.recordings||[]).some(function(r){return(r.interpreter||"").toLowerCase().includes(q);});
  }):ALL;
  document.getElementById("sub").textContent=filtered.length+"/"+ALL.length+" guide";
  renderLib(filtered);
}

async function load(){
  try{
    var lib=null;
    try{var r1=await fetch("https://giovanniguazzarotti-spec.github.io/discografia/biblioteca.json?t="+Date.now());if(r1.ok)lib=await r1.json();}catch(e1){}
    if(!lib){
      var h=tok()?hdr():{"User-Agent":"DA"};
      var r2=await fetch("https://api.github.com/repos/"+REPO+"/contents/"+GH,{headers:h});
      if(!r2.ok)throw new Error("File non trovato ("+r2.status+")");
      var d=await r2.json();
      lib=JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,"")))));
    }
    ALL=lib;
    document.getElementById("sub").textContent=lib.length+" guide salvate";
    renderLib(lib);
  }catch(e){
    document.getElementById("sub").textContent="Errore: "+e.message;
  }
}
load();
</script>
</body>
</html>
