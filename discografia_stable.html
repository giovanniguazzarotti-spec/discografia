// ── STORAGE ───────────────────────────────────────────────────────────────────
const LS_LIB = "cdc_library_v1", LS_KEY = "cdc_apikey_v1";
function loadLibrary() { try { return JSON.parse(localStorage.getItem(LS_LIB)||"[]"); } catch{return[];} }
function saveLibrary(lib) {
  try {
    const safe = lib.slice(-200).map(e=>({...e, recordings:(e.recordings||[]).map(r=>({
      ...r, execNote:(r.execNote||"").slice(0,300), recNote:(r.recNote||"").slice(0,300),
      criticalNote:(r.criticalNote||"").slice(0,500), qobuz:(r.qobuz||[]).slice(0,4), reviews:(r.reviews||[]).slice(0,4),
    }))}));
    const val=JSON.stringify(safe);
    if(val.length>4500000) return saveLibrary(safe.slice(1));
    localStorage.setItem(LS_LIB,val); return safe;
  } catch(e){console.error(e);return lib;}
}
function loadApiKey() { return localStorage.getItem(LS_KEY)||""; }
function saveApiKey(k) { localStorage.setItem(LS_KEY,k); }

// ── QOBUZ LINK ────────────────────────────────────────────────────────────────
function toOpenQobuz(url) {
  if(!url) return null;
  try { const u=new URL(url); const p=u.pathname.split("/").filter(Boolean); const id=p[p.length-1]; return id?`https://open.qobuz.com/album/${id}`:url; }
  catch{return url;}
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────────────────
function exportLibrary(library, entries) {
  const all = entries || [{...BUILTIN,_builtin:true},...library];
  const st=n=>"\u2605".repeat(n)+"\u2606".repeat(5-n);
  const lines=["BIBLIOTECA DISCOGRAFICA CLASSICA","Fonti: Gramophone, BBC Music Magazine, ClassicsToday, The Guardian, The Classic Review","Esportata il "+new Date().toLocaleDateString("it-IT",{day:"2-digit",month:"long",year:"numeric"}),"=".repeat(60)];
  all.forEach((e,ei)=>{
    const idx=e._builtin?1:ei+1;
    lines.push("","#"+idx+"  "+e.work);
    if(e.instrument)lines.push("Strumento: "+e.instrument);
    if(e.savedAt)lines.push("Data: "+e.savedAt);
    if(e.summary)lines.push(e.summary);
    lines.push("-".repeat(60));
    (e.recordings||[]).forEach(rec=>{
      lines.push("  "+rec.rank+". "+rec.interpreter+"  ["+rec.label+" - "+rec.year+"]  "+rec.consensusIcon+" "+rec.consensus);
      lines.push("     Esec: "+st(rec.execStars||0)+"  Reg: "+st(rec.recStars||0));
      if(rec.execNote)lines.push("     "+rec.execNote);
      if(rec.criticalNote)lines.push("     "+rec.criticalNote);
      const ql=(rec.qobuz||[]).filter(q=>q.url).map(q=>{try{const u=new URL(q.url);const p=u.pathname.split("/").filter(Boolean);return "https://open.qobuz.com/album/"+p[p.length-1];}catch{return q.url;}});
      if(ql.length)lines.push("     Qobuz: "+ql.join(" | "));
      lines.push("");
    });
    if(e.recommendation)lines.push("  Consiglio: "+e.recommendation);
    lines.push("=".repeat(60));
  });
  return lines.join("\n");
}
function importLibrary(file, onSuccess, onError) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const guides = data.guides || (Array.isArray(data)?data:[]);
      if(!guides.length) { onError("File vuoto o formato non riconosciuto."); return; }
      onSuccess(guides);
    } catch { onError("Errore nel leggere il file JSON."); }
  };
  reader.readAsText(file);
}

// ── SEARCH PANEL ──────────────────────────────────────────────────────────────
function SearchPanel({apiKey,onResults,onNeedKey,searchKey}) {
  const [composer,setComposer]=useState("");
  const [work,setWork]=useState("");
  const [instrument,setInstrument]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);

  const search=async()=>{
    if(!composer.trim()&&!work.trim())return;
    if(!apiKey){onNeedKey();return;}
    setLoading(true);setError(null);
    var p="Critico musicale.\nCompositore: "+(composer||"n/d")+"\nOpera: "+(work||"n/d")+"\nStrumento: "+(instrument||"n/d")+"\n4-6 registrazioni Hi-Res/CD lossless: Gramophone, BBC, ClassicsToday, Guardian. qobuzUrl se noto.\nJSON: {\"work\":\"x\",\"instrument\":\"x\",\"summary\":\"x\",\"recommendation\":\"x\",\"recordings\":[{\"rank\":1,\"interpreter\":\"x\",\"label\":\"x\",\"year\":\"x\",\"books\":\"x\",\"execStars\":5,\"recStars\":4,\"consensus\":\"x\",\"consensusIcon\":\"🟢\",\"execNote\":\"x\",\"recNote\":\"x\",\"criticalNote\":\"x\",\"qobuzUrl\":null}]}";
    try{
      var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:4000,messages:[{role:"user",content:p}]})});
      if(!r.ok){var e=await r.json().catch(function(){return{};});if(r.status===401)throw new Error("Chiave non valida.");if(r.status===429)throw new Error("Rate limit.");throw new Error((e.error&&e.error.message)||"Errore "+r.status);}
      var d=await r.json();var t=(d.content||[]).map(function(b){return b.text||"";}).join("");
      var cl=t.replace(/```json|```/g,"").trim();var a=cl.indexOf("{"),b=cl.lastIndexOf("}");
      if(a<0||b<0)throw new Error("Formato non valido.");
      var jsonStr=cl.slice(a,b+1);
      try{onResults(JSON.parse(jsonStr));}
      catch(e2){onResults(JSON.parse(jsonStr.replace(/,[^,]*$/,"")+"]}"));}
    }catch(e){setError(e.message||"Errore.");}
    finally{setLoading(false);}
  };

  return (
    <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:8,padding:18,marginBottom:20}}>
      <h3 style={{color:C.gold,margin:"0 0 14px",fontSize:13,letterSpacing:2,textTransform:"uppercase"}}>🔍 Cerca nuova opera</h3>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:9,marginBottom:11}}>
        {[["Compositore",composer,setComposer,"es. Schubert…"],["Opera",work,setWork,"es. Winterreise…"],["Strumento",instrument,setInstrument,"es. pianoforte…"]].map(([l,v,s,p])=>(
          <div key={l}>
            <label style={{color:C.muted,fontSize:9,letterSpacing:1,textTransform:"uppercase",display:"block",marginBottom:4}}>{l}</label>
            <input value={v} onChange={e=>s(e.target.value)} placeholder={p} onKeyDown={e=>e.key==="Enter"&&search()}
              style={{width:"100%",background:"#0a0806",border:`1px solid ${C.faint}`,color:C.cream,padding:"7px 9px",borderRadius:4,fontSize:12,outline:"none"}}/>
          </div>
        ))}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <button onClick={search} disabled={loading||(!composer.trim()&&!work.trim())} style={{background:loading?"#2a2520":C.gold,color:loading?"#666":"#0f0d09",border:"none",borderRadius:4,padding:"8px 20px",fontSize:13,fontWeight:700,cursor:loading?"not-allowed":"pointer"}}>
          {loading?<span>⏳ Ricerca in corso…</span>:"Cerca registrazioni"}
        </button>
        {!apiKey&&<span style={{color:C.amber,fontSize:11}}>⚠️ Nessuna chiave API — <button onClick={onNeedKey} style={{background:"none",border:"none",color:C.gold,cursor:"pointer",fontSize:11,textDecoration:"underline",padding:0}}>configurala</button></span>}
      </div>
      {error&&<p style={{color:C.red,fontSize:11,marginTop:8,marginBottom:0}}>{error}</p>}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [apiKey,setApiKey]=useState(null);
  const [showSetup,setShowSetup]=useState(false);
  const [ghTok,setGhTok]=useState("");
  const [searchKey,setSearchKey]=useState(0);
  const [library,setLibrary]=useState([]);
  const [active,setActive]=useState(null);
  const [expanded,setExpanded]=useState(null);
  const [showLib,setShowLib]=useState(false);
  const [flash,setFlash]=useState(false);
  const libraryRef=useRef([]);

  useEffect(()=>{
    const k=loadApiKey(); setApiKey(k); setShowSetup(!k);
    setGhTok(window.GH.tok());
    const lib=loadLibrary(); setLibrary(lib); libraryRef.current=lib;
  },[]);

  const handleSetup=k=>{saveApiKey(k);setApiKey(k);setShowSetup(false);};

  const handleResults=useCallback(data=>{
    const now=new Date().toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"});
    const seenUrls=new Set();
    const entry={...data,id:`s_${Date.now()}`,savedAt:now,
      recordings:(data.recordings||[]).map((r,i)=>{
        const qobuz=[];
        if(r.qobuzUrl&&r.qobuzUrl!=="null"&&typeof r.qobuzUrl==="string"&&r.qobuzUrl.startsWith("http")&&!seenUrls.has(r.qobuzUrl)){
          seenUrls.add(r.qobuzUrl);
          qobuz.push({label:"Ascolta",url:r.qobuzUrl});
        }
        return {
          rank:r.rank||i+1,level:r.execStars>=5?"A":r.execStars>=4?"B":"C",
          interpreter:r.interpreter||"—",label:r.label||"—",year:r.year||"—",books:r.books||"—",
          consensus:r.consensus||"—",consensusIcon:r.consensusIcon||"🟡",
          execStars:r.execStars||3,recStars:r.recStars||3,
          execNote:r.execNote||"",recNote:r.recNote||"",criticalNote:r.criticalNote||"",
          qobuz,reviews:[],
        };
      }),
    };
    setActive(entry);setExpanded(null);setSearchKey(function(k){return k+1;});
    // Use ref to always have current library value, avoiding stale closure
    const updated=saveLibrary([...libraryRef.current,entry]);
    libraryRef.current=updated;
    setLibrary(updated);setFlash(true);setTimeout(()=>setFlash(false),2500);
  },[]);

  const handleSaveQobuz=function(rec,url){
    if(!active||!active.recordings)return;
    var upd={...active,recordings:active.recordings.map(function(r){if(r.rank!==rec.rank||r.interpreter!==rec.interpreter)return r;if((r.qobuz||[]).some(function(q){return q.url===url;}))return r;return {...r,qobuz:[...(r.qobuz||[]),{label:"Ascolta",url:url}]};})};setActive(upd);var lu=libraryRef.current.map(function(e){return e.id===upd.id?upd:e;});saveLibrary(lu);libraryRef.current=lu;setLibrary(lu);window.GH.save(lu,window.GH.tok());
  };
  const handleDelete=id=>{
    const updated=saveLibrary(libraryRef.current.filter(e=>e.id!==id));
    libraryRef.current=updated;
    setLibrary(updated);if(active&&active.id===id)setActive(null);
  };

  const handleImport=guides=>{
    const merged=saveLibrary([...libraryRef.current,...guides.filter(g=>!libraryRef.current.find(e=>e.id===g.id))]);
    libraryRef.current=merged;
    setLibrary(merged);
  };

  if(showSetup) return <SetupScreen onSave={handleSetup}/>;
  if(apiKey===null) return null;

  const isBuiltin=!!(active&&active.id==="builtin_bach_wtc");

  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.cream,fontFamily:"'Palatino Linotype',Georgia,serif"}}>

      {/* Header */}
      <div style={{background:"linear-gradient(180deg,#1a1408 0%,#0f0d09 100%)",borderBottom:`1px solid ${C.border}`,padding:"14px 16px 12px"}}>
        <div style={{maxWidth:880,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{color:C.gold,fontSize:8,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>Guida alle Registrazioni · Musica Classica</div>
              <h1 style={{margin:0,fontSize:17,fontWeight:400,color:C.cream,lineHeight:1.2}}>Critica Discografica Specializzata</h1>
              <p style={{color:C.muted,fontSize:9,margin:"4px 0 0",lineHeight:1.5}}>Gramophone · BBC Music · ClassicsToday · The Guardian · Limelight</p>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end",flexShrink:0}}>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
                
                <button onClick={()=>setShowLib(true)} style={{background:C.gold+"22",color:C.gold,border:`1px solid ${C.gold}`,borderRadius:5,padding:"5px 11px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>
                  📚 {library.length>0?`Biblioteca (${library.length})`:"Biblioteca"}
                </button>
              </div>
              {flash&&<span className="flash" style={{color:C.green,fontSize:10}}>✓ Salvata</span>}
              {apiKey&&<span onClick={()=>setShowSetup(true)} style={{color:"#4a8a5a",fontSize:10,cursor:"pointer",textDecoration:"underline dotted",marginTop:6,display:"block"}}>🔑 API configurata</span>}
              <span onClick={()=>{var t=prompt("GitHub Token:",ghTok);if(t!==null){window.GH.save(t);setGhTok(t);}}} style={{color:ghTok?"#4a8a5a":"#c9a84c",fontSize:10,cursor:"pointer",textDecoration:"underline dotted",marginTop:4,display:"block"}}>{ghTok?"📂 GitHub conf.":"📂 GitHub..."}</span>
            </div>
          </div>
        </div>
      </div>

      <div style={{maxWidth:880,margin:"0 auto",padding:"22px 24px"}}>
        <SearchPanel apiKey={apiKey} onResults={handleResults} onNeedKey={()=>setShowSetup(true)} searchKey={searchKey}/>
        <SourcesPanel/>

        {active&&<div>
        {/* Results header */}
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14,gap:12}}>
          <div style={{flex:1}}>
            <div style={{color:C.gold,fontSize:11,letterSpacing:2,textTransform:"uppercase",marginBottom:3}}>{isBuiltin?"Risultati precaricati":"Risultati ricerca"}</div>
            <div style={{color:C.cream,fontSize:17,fontStyle:"italic",lineHeight:1.3}}>{active.work}</div>
            {active.instrument&&<div style={{color:C.muted,fontSize:11,marginTop:2}}>{active.instrument}</div>}
            {active.summary&&<div style={{color:C.mid,fontSize:11,marginTop:5,lineHeight:1.65,maxWidth:580}}>{active.summary}</div>}
          </div>
          <div style={{display:"flex",gap:8,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end"}}>
            {!isBuiltin&&<button onClick={()=>{setActive(BUILTIN);setExpanded(null);}} style={{background:"transparent",border:`1px solid ${C.faint}`,color:C.muted,padding:"5px 11px",borderRadius:4,fontSize:11,cursor:"pointer"}}>← Bach / WTC</button>}
            <button onClick={()=>generatePDF(active)} style={{background:"transparent",border:`1px solid ${C.gold}44`,color:C.goldDim,padding:"5px 11px",borderRadius:4,fontSize:11,cursor:"pointer"}} title="Scarica PDF">↓ PDF</button>
          </div>
        </div>

        {/* Legend */}
        <div style={{display:"flex",gap:14,marginBottom:12,flexWrap:"wrap"}}>
          {[["🟢 Unanime",C.green],["🟡 Qualche riserva",C.amber],["🔴 Diviso",C.red]].map(([t,c])=>(
            <span key={t} style={{color:c,fontSize:10}}>{t}</span>
          ))}
          <span style={{color:"#3a3a3a",fontSize:10,marginLeft:"auto"}}>▼ Clicca per espandere</span>
        </div>

        {(active.recordings||[]).map((rec,i)=>(
          <Card key={i} rec={rec} expanded={expanded===i} onToggle={()=>setExpanded(expanded===i?null:i)} work={active.work} onSave={handleSaveQobuz}/>
        ))}

        {active.recommendation&&(
          <div style={{background:C.bg2,border:`1px solid ${C.borderGold}`,borderRadius:6,padding:"12px 16px",marginTop:14}}>
            <div style={{color:C.gold,fontSize:9,letterSpacing:2,textTransform:"uppercase",marginBottom:5}}>💡 Consiglio finale</div>
            <p style={{color:C.mid,fontSize:12,margin:0,lineHeight:1.7}}>{active.recommendation}</p>
          </div>
        )}

        </div>}
        <div style={{borderTop:`1px solid ${C.bg3}`,marginTop:36,paddingTop:12,color:C.faint,fontSize:10}}>
          Critica Discografica Specializzata · Maggio 2026 · Biblioteca salvata in questo browser · {library.length}/200 guide
        </div>
      </div>

      {/* Library modal */}
      {showLib&&<LibraryModal
        library={library} activeId={active&&active.id}
        onSelect={e=>{setActive(e);setExpanded(null);}}
        onDelete={handleDelete}
        onClose={()=>setShowLib(false)}
        onExport={()=>exportLibrary(library)}
      />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
